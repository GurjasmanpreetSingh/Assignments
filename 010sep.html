<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> Assignment: - Conditional statements if and if else</h1>
    <script>
        // Q1 Basic Level (If Condition) • Write a program to check if a number is positive.
        // Ans - 
        let a = 10;
        if (a >= 0) {
            console.log("Positive")     // Ans - Positive

        }

        // Q2  Check if a number is greater than 100. 
        // Ans - 
        let num = 110;
        if (num > 100) {
            console.log("Number is Greater than 100")    //Ans - Number is Greater than 100
        }

        // Q3 Take a user’s age and print “Eligible to vote” if age ≥ 18. • Check if a given string is not empty. 
        // Ans - 
        let age = 20;
        if (age >= 18) {
            console.log("Eligible to vote")         //Ans - Eligible to vote
        }

        // Q4 Check if a variable marks is greater than 35, then print “Pass”
        // Ans - 
        let marks = 36;
        if (marks > 35) {
            console.log("Pass")   //Ans - Pass
        }

        // Q5 If-Else Practice Questions • Write a program to check if a number is even or odd.
        // Ans - 
        let num1 = 10;
        if (num1 % 2 == 0) {
            console.log("Even")
        } else {
            console.log("Odd")     //Ans - Even
        }

        // Q6 Take a temperature value — if it’s above 30 print “Hot”, else print “Cool”
        // Ans - 
        let temp = 29;
        if (temp > 30) {
            console.log("Hot")
        } else {
            console.log("Cold")   //Ans - Cold
        }

        // Q7 Check if a given number is divisible by 5 — if not, print “Not Divisible”
        let no = 25;
        if (no % 5 == 0) {
            console.log("Divisible")
        } else {
            console.log("Not Divisible")     //Ans - Divisible
        }

        // Q8 If a person’s age is ≥ 18 print “Adult”, else “Minor”. 
        // Ans - 
        let personAge = 25;
        if (personAge >= 18) {
            console.log("Adult")

        } else {
            console.log("Minor")         //Ans - Adult
        }

        // Q9 If a string is 'JavaScript', print “Correct language!”, else print “Try again!”
        // Ans - 
        let String = 'JavaScript'

        if (String == 'JavaScript') {
            console.log("Correct language!")
        } else {
            console.log("Try again")      //Ans - Correct language!
        }

        // Q10 Mini Practice Challenges • Write a program to find the largest of two numbers using if-else. 
        // Ans - 
        let n = 5
        let m = 14
        if (n > m) {
            console.log("N is Largest")
        } else {
            console.log("M is Largest")       //Ans - M is Largest
        }

        // Q11 Take a year and check whether it’s a leap year. 
        // Ans - 
        let year = 2004
        if(year % 4 == 0){
            console.log("Leap Year")     //Ans - Leap Year
        }


        // Q12  Check if a number is divisible by both 3 and 5
        let g = 60;
        if(g % 3 == 0 && g % 5 == 0){
            console.log("Number is Divisible")
        }  else {
            console.log("Number is not divisible")     //Ans - Number is Divisible
        }

        // Q13  Take user input for username and password and print “Login Successful” if both match.
        let username = "Gurjas"
        let password = 123;
        if (username === "Gurjas" && password === 123) {
            console.log("Login Successful")       //Ans - Login Successful
        }
    </script>
</body>

</html>
