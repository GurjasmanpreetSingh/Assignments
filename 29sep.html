<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        .calculator {
            width: 300px;
            padding: 20px;
            margin: auto;
            background-color: rgb(5, 66, 110);
            border: 2px solid black;
            border-radius: 15px;
        }

        .display {
            width: 100%;
            height: 55px;

            border: none;
            border-radius: 8px;

            background-color: white;

            text-align: right;
            padding: 5px 10px;

            font-size: 25px;
            margin-bottom: 20px;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .keys input {
            height: 50px;
            border: 2px solid white;
            border-radius: 7px;

            background-color: white;

            font-size: 20px;
            cursor: pointer;
        }

        .keys input:hover {
            background-color: #dddddd;
        }

        .equal {
            grid-column: span 2;
        }
    </style>
</head>

<body>
  <h1>DOM Project based task</h1>

  <h3> Simple Calculator</h3>
  <input type="number" placeholder="Enter First Number" id="num1">
  <br>
  <br>
  <input type="number" placeholder="Enter Second Number" id="num2">
  <br>
  <br>
  <button onclick="add()">+</button>
  <button onclick="sub()">-</button>
  <button onclick="multiply()">*</button>
  <button onclick="divide()">/</button>
  <br>
  <br>
  <!-- <button onclick="result()">Result</button> -->

  <p id="result"></p>



  <input type="text" id="value" placeholder="Enter any value">

  <button onclick="checkValue()">Check</button>

  <p id="result"></p>
  <br>
  <br>


  <input type="text" placeholder=" Enter Name">
  <br><br>
  <input type="email" placeholder=" Enter Email">
  <br><br>
  <input type="password" id="password" placeholder=" Enter Password">
  <br><br>
  <input type="password" id="confirmPassword" placeholder=" Enter Confirm Password">
  <br><br>
  <input type="number" placeholder=" Enter Phone Number">
  <br><br>
  <button onclick="submit()">Submit</button>
  <p id="para"></p>


  <h1>Fully Functional Calculator</h1>
       <div class="calculator">

        <form action="">

            <!-- Display -->
            <input type="text" name="display" class="display" readonly>

            <!-- Calculator Keys -->
            <div class="keys">

                <input type="button" value="AC" style="color: red;" onclick="display.value=''">

                <input type="button" value="DEL" style="color: red;" onclick="display.value=display.value.slice(0,-1)">

                <input type="button" value="." style="color: red;" onclick="display.value+='.'">

                <input type="button" value="/"  style="color: red;"onclick="display.value+='/'">


                <input type="button" value="7" onclick="display.value+='7'">

                <input type="button" value="8" onclick="display.value+='8'">

                <input type="button" value="9" onclick="display.value+='9'">

                <input type="button" value="*" style="color: red;" onclick="display.value+='*'">


                <input type="button" value="4" onclick="display.value+='4'">

                <input type="button" value="5" onclick="display.value+='5'">

                <input type="button" value="6" onclick="display.value+='6'">

                <input type="button" value="-" style="color: red;" onclick="display.value+='-'">


                <input type="button" value="1" onclick="display.value+='1'">

                <input type="button" value="2" onclick="display.value+='2'">

                <input type="button" value="3" onclick="display.value+='3'">

                <input type="button" value="+"  style="color: red;"onclick="display.value+='+'">


                <input type="button" value="00" onclick="display.value+='00'">

                <input type="button" value="0" onclick="display.value+='0'">

                <input type="button" value="=" style="color: red;" class="equal" onclick="display.value=eval(display.value)">

            </div>

        </form>

    </div>

    
</div>

    // DOM Project based task
    // Qus 1. Create a simple calculator using HTML, CSS, and JavaScript. Add two input fields for taking two numbers as input. Create four buttons — Add, Subtract, Multiply, and Divide. When the user clicks any button, perform the corresponding operation on the two input values and display the result below the buttons. 
    // Ans - 
    function add() {
      let num1 = Number(document.getElementById("num1").value);
      let num2 = Number(document.getElementById("num2").value);

      let result = num1 + num2;

      document.getElementById("result").innerText = result

    }
    function sub() {
      let num1 = Number(document.getElementById("num1").value);
      let num2 = Number(document.getElementById("num2").value);

      let result = num1 - num2;

      document.getElementById("result").innerText = result

    }
    function multiply() {
      let num1 = Number(document.getElementById("num1").value);
      let num2 = Number(document.getElementById("num2").value);

      let result = num1 * num2;

      document.getElementById("result").innerText = result

    }
    function divide() {
      let num1 = Number(document.getElementById("num1").value);
      let num2 = Number(document.getElementById("num2").value);

      let result = num1 / num2;

      document.getElementById("result").innerText = result

    }

    // Q2. Check Number or String

    // Create an input field where the user can enter any value.

    // Add a button.
    // When the user clicks the button, check whether the entered value is a number or a string.
    // Display the result on the webpage.

    // Ans - 
    function checkValue() {
      let enterValue = document.getElementById("value").value
      if (enterValue === "") {
        document.getElementById("result").innerText = "Please enter a value";
      } else if (isNaN(enterValue)) {
        document.getElementById("result").innerText = "It is a string";
      } else {
        document.getElementById("result").innerText = "It is a number"
      }
    }

    // If they are different, display:
    // "Password does not match"

    // Display the appropriate message on the webpage.

    // Ans - 
    function submit() {
      let password = document.getElementById("password").value
      let confirmPassword = document.getElementById("confirmPassword").value
      if (password === confirmPassword) {
        document.getElementById("para").innerText = "Password matched"
      } else {
        document.getElementById("para").innerText = "Password does not match"
      }

    }
