    <script>
    // Operator in js
    // Q1 Arithmetic Operators - Write a program to add, subtract, multiply, and divide two numbers. 
    // Ans - 
    let a = 30
    let b = 20
    console.log("Add - " + (a + b))        //Ans - 50
    console.log("Sub - " + (a - b))        //Ans - 10
    console.log("Multiply - " + (a * b))   //Ans - 600
    console.log("Divide - " + (a / b))     //Ans - 1.5

    // Q2 Predict the result: 
    // Ans - 
     console.log(10 + 5 * 2);        //Ans - 20
     console.log((10 + 5) * 2);      //Ans - 30

    // Q3 Write a program to find the area of a circle (πr²) using a variable r = 5. 
    // Ans - 
    let r = 5
    let area = (3.14 * r * r)
    console.log("The area of a circle - " + area)    //Ans - 78.5

    // Q4 Find the remainder when 17 is divided by 3
    // Ans - 
    let num = 17
    let remainder = (num % 3)
    console.log("Remainder - " + remainder)      //Ans - 2

    // Q5  If a = 10, what are the values of a++ and ++a?
    // Ans - 
    let A = 10
    console.log("The values of a++ - " + A++)   //Ans - 10
    console.log("The values of a++ - " + ++A)   //Ans - 11

    // Q6  If let x = 5; x += 3;, what is the value of x? - Write a program using *=, /=, and -= to modify a number. 
    // Ans - 
    let x = 5; 
    x += 3;
    x *= 3;
    x /= 3;
    x -= 3;
    console.log(x)   //Ans - 5

              // let b = 10

    // Q11  Predict the results: 
    console.log(10>5);     //True

    console.log(10 == '10');   // True
    console.log(10 === '10');  //False
    console.log(10 != 8);     //True
    console.log(10 !== '10'); // True
