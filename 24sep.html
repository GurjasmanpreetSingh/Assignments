<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
</head>

<body>
    <h1 id="head">Hello Ishan</h1>
    <p id="para"></p>

    <button onclick="change()">Change</button>



    <script>
        function change() {
            document.getElementById("head").innerHTML = "Hello Jasman"
            document.getElementById("para").innerHTML = "Hlo Jasman How are you!!"

        }

       


    </script>
</body>

</html>
