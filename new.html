<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            justify-self: center;
        }

        .main {
            height: 495px;
            width: 290px;
            border: 2px solid black;
            border-radius: 15px;
            justify-self: center;
            background-color: rgb(5, 66, 110);
        }

        .input {
            height: 45px;
            width: 190px;
            border: 2px solid white;
            background-color: white;
            justify-self: center;
            margin: 20px;
            border-radius: 7px;
            /* text-align: right;
            padding: 4px; */

            display: flex;
            align-items: center;
            justify-content: flex-end;

            padding: 0 10px;
            font-size: 20px;

        }

        .keys {
            justify-content: center;
            /* padding-top: 12px; */
            text-align: center;
            height: 50px;
            width: 50px;
            border: 2px solid white;
            background-color: white;
            border-radius: 7px;
            font-size: 20px;
            margin: 10px;
        }

        .key1 {
            justify-content: center;
            /* padding-top: 12px; */
            text-align: center;
            height: 50px;
            width: 120px;
            border: 2px solid white;
            background-color: white;
            border-radius: 7px;
            font-size: 20px;
            margin: 10px;


        }

        .keys-container {
            display: inline-grid;
            grid-template-columns: repeat(4, 60px);
            gap: 5px;
            /* padding: 20px; */
            margin: 10px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h1>Fully Functional Calculator</h1>
    <div class="main">
        <div class="input">
            12325
        </div>
        <div class="keys-container">
            <button class="keys">1</button>
            <button class="keys">2</button>
            <button class="keys">3</button>
            <button class="keys">4</button>
            <button class="keys">5</button>
            <button class="keys">6</button>
            <button class="keys">7</button>
            <button class="keys">8</button>
            <button class="keys">9</button>
            <button class="keys">.</button>
            <button class="keys">+</button>
            <button class="keys">-</button>
            <button class="keys">*</button>
            <button class="keys">/</button>
            <button class="keys">0</button>
            <button class="keys">00</button>
            <button class="keys">=</button>
            <button class="keys">AC</button>
            <button class="key1">DE</button>
        </div>

    </div>
</body>

</html>
